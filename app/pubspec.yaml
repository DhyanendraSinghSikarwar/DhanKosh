name: hisaab
description: Hisaab - on-device personal finance tracker.
publish_to: none
version: 0.0.7+40
environment:
  sdk: ^3.5.0

# Resolved with Flutter 3.47.7 on 2026-10-21 (pub upgrade --major-versions); pinned in pubspec.lock.
dependencies:
  crypto: ^3.0.3
  csv: ^8.0.0
  drift: ^2.20.0
  enough_mail: ^2.1.6
  excel: ^4.0.6
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_mlkit_text_recognition: ^0.17.1
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  intl: ^0.19.0
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  parser_core:
    path: packages/parser_core
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.12.0
  pointycastle: ^3.9.1
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  sqlite3: ^3.7.1
dev_dependencies:
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/logos/

# SQLCipher via package:sqlite3 build hook (sqlcipher_flutter_libs is obsolete). ADR-0003.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
