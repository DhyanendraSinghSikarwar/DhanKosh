# Manual release of DhanKosh as a GitHub Release with an Android APK (F-32).
# iOS is not built for now (owner decision 2026-10-26).
#
# Direct-merge flow, no pull request: run this workflow on `main` (Actions ->
# Release -> Run workflow). It checks the code, bumps app/pubspec.yaml and
# CHANGELOG.md with tools/prepare_release.py, builds the APK, pushes one
# `chore(release)` commit to main, then creates tag v<version> and the release
# with stable asset names: DhanKosh.apk and DhanKosh.apk.sha256.
# Nothing is published when a check or the build fails or the tag exists.
#
# Signing (repository secrets; names only; Settings -> Secrets and variables -> Actions):
#   HISAAB_RELEASE_KEYSTORE   base64 of the release keystore (.jks)   -> stable signature
#   HISAAB_KEYSTORE_PASSWORD  the keystore (store) password
#   HISAAB_KEY_PASSWORD       optional, the key password when it differs from the store password
#   HISAAB_KEY_ALIAS          optional, key alias (default: hisaab)
#   SUPPORT_UPI_ID            optional, donation UPI id; empty hides Support in the app
# Without the keystore secrets the APK is signed with the runner's throw-away
# debug key: it installs, but a later build cannot update it (uninstall first)
# and the release notes say so. tools/make_keystore.sh creates the real key once.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version X.Y.Z (empty keeps the pubspec version)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    name: Check, build and tag Android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Checks
        run: |
          python3 tools/check_memory.py
          python3 tools/check_architecture.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          cd app
          flutter pub get
          dart run build_runner build -d
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
          cd packages/parser_core
          dart pub get
          dart test

      - name: Bump version and changelog
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            python3 tools/prepare_release.py bump --version "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            python3 tools/prepare_release.py bump >> "$GITHUB_OUTPUT"
          fi

      - name: Tag must be new
        run: |
          if git rev-parse "v${{ steps.bump.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.bump.outputs.version }} is already released."; exit 1
          fi

      - name: Build APK
        id: build
        env:
          KEYSTORE: ${{ secrets.HISAAB_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.HISAAB_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HISAAB_KEY_PASSWORD }}
          ALIAS: ${{ secrets.HISAAB_KEY_ALIAS }}
          SUPPORT_UPI_ID: ${{ secrets.SUPPORT_UPI_ID }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            keys="$RUNNER_TEMP/keys"
            mkdir -p "$keys"
            echo "$KEYSTORE" | base64 -d > "$keys/release.jks"
            # Generated at build time, never committed (.gitignore blocks both files).
            {
              echo "storeFile=$keys/release.jks"
              echo "storePassword=$PASSWORD"
              echo "keyAlias=${ALIAS:-hisaab}"
              echo "keyPassword=${KEY_PASSWORD:-$PASSWORD}"
            } > app/android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: the APK uses a throw-away debug key and cannot be updated in place."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          cd app
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=APP_VERSION=${{ steps.bump.outputs.version }} \
            --dart-define=SUPPORT_UPI_ID="$SUPPORT_UPI_ID"
          cd ..
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/DhanKosh.apk
          rm -rf "$RUNNER_TEMP/keys" app/android/key.properties
          (cd dist && sha256sum DhanKosh.apk | cut -d' ' -f1 > DhanKosh.apk.sha256)
          # Signer certificate in the log for verification.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs dist/DhanKosh.apk | grep Signer || true

      - name: Commit the bump to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.android.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          v="${{ needs.android.outputs.version }}"
          python3 tools/prepare_release.py notes --version "$v" --sha "$(cat dist/DhanKosh.apk.sha256)" > notes.md
          {
            echo
            echo "### Install"
            echo "- **Android:** download \`DhanKosh.apk\`, open it, allow installs from this source."
            if [ "$SIGNED" != "true" ]; then
              echo "  - This build is signed with a throw-away test key. Uninstall any earlier DhanKosh before installing it, and expect to uninstall again for the next build until a permanent release key is configured."
            fi
            echo "- **iPhone:** not available yet."
          } >> notes.md
          gh release create "v$v" dist/DhanKosh.apk dist/DhanKosh.apk.sha256 \
            --target "${{ needs.android.outputs.commit }}" --title "DhanKosh $v" --notes-file notes.md
