name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  structure:
    name: Docs and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_memory.py
      - run: python3 tools/check_architecture.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  analyse:
    name: Analyse and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: parser_core
        working-directory: app/packages/parser_core
        run: |
          dart pub get
          dart analyze
          dart test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: [analyse]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: hisaab-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Catches release-only breakage (minify, signing config) early; signed with
  # the debug key unless release secrets exist. Not required for merge.
  release-build:
    name: Release APK builds
    runs-on: ubuntu-latest
    needs: [analyse]
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hisaab-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
